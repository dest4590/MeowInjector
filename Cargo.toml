[workspace]
members = ["crates/*"]
exclude = ["crates/meow-driver"]
resolver = "2"

[package]
name = "meow-injector"
version = "0.1.0"
edition = "2024"
description = "Cat-themed kernel injector with GUI"
build = "build.rs"

[dependencies]
meow-gui = { path = "crates/meow-gui" }
meow-core = { path = "crates/meow-core" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
obfstr = "0.4.6"

[target.'cfg(target_os = "windows")'.dependencies]


[build-dependencies]
winresource = "0.1"
